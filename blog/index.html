<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tin tức làng Việt</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tin tức làng Việt</h1>

<div id="posts"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } 
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyB2BxJPUxWPoUle47DEmSqzB8l6tdUyIoI",
authDomain: "tinlangviet.firebaseapp.com",
projectId: "tinlangviet",
storageBucket: "tinlangviet.firebasestorage.app",
messagingSenderId: "895323284131",
appId: "1:895323284131:web:89eb582fa1e9d091525516"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(collection(db,"posts"), orderBy("date","desc"));
const snapshot = await getDocs(q);

let html = "";

snapshot.forEach(doc=>{
let p = doc.data();

html += `
<div class="post">
<a href="post.html?id=${doc.id}">
<h2>${p.title}</h2>
<img src="${p.image}" width="300">
<p>${p.summary}</p>
</a>
</div>
`;
});

document.getElementById("posts").innerHTML = html;

</script>

</body>
</html>
