<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hoan Tất Niên</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://i.imgur.com/ZfX8F4u.jpg'); /* Nền Tết */
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            padding: 60px;
        }
        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .content p {
            font-size: 1.3rem;
            line-height: 1.6;
        }
        .separator img {
            max-width: 80%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        iframe {
            width: 80%;
            max-width: 800px;
            height: 600px;
            border: none;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        /* Hiệu ứng pháo hoa */
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <canvas class="fireworks"></canvas>

    <div class="content">
        <h1>LIÊN HOAN TẤT NIÊN LÀNG VIỆT</h1>
        <p>THỜI GIAN: 18H00 NGÀY 20/01/2024</p>
        <p>ĐỊA ĐIỂM: NHÀ VIỆT NAM SỐ 2251 R STREET NW 20008, WASHINGTON DC</p>
        
        <div class="separator">
            <a href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhtHa0WK-v6_25lopbmVNQvjdl6CJak8scbmkE0DusAcaoA1GIWXO2LGWwH6-QVjvui8c9lLHdvpsWW9ggNziPXcAoKTyCD0UAe7aPogwbKBZnf5FxVvPXPt2x1Wp4mFexpXczJWc8IOzuSEafNIuDY3LyjAw_Aap19Td-rTqgai4C29TeUTtPmi4Hez1kn/s765/anh-tet-careerbuilder-4.jpg">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhtHa0WK-v6_25lopbmVNQvjdl6CJak8scbmkE0DusAcaoA1GIWXO2LGWwH6-QVjvui8c9lLHdvpsWW9ggNziPXcAoKTyCD0UAe7aPogwbKBZnf5FxVvPXPt2x1Wp4mFexpXczJWc8IOzuSEafNIuDY3LyjAw_Aap19Td-rTqgai4C29TeUTtPmi4Hez1kn/s765/anh-tet-careerbuilder-4.jpg" alt="Ảnh Tết">
            </a>
        </div>

        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe61p_IOL5A7HDCCOOSvp0SsgjmRe2bnSs54Sq3ilpRKqc6sw/viewform?embedded=true">Loading…</iframe>
        
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRV6i4kdoR7e7VDF_CsvqEPDAtVfavlmjohG23iobsN3ldCXfI9zcPZeTqOlAJgRcRVukxVioS2MA77/pubhtml?gid=2109639450&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    </div>

    <script>
        const canvas = document.querySelector('.fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }
        function drawFirework(x, y) {
            const particles = 100;
            for (let i = 0; i < particles; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = random(1, 5);
                const dx = Math.cos(angle) * speed;
                const dy = Math.sin(angle) * speed;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${Math.random() * 360}, 100%, 50%)`;
                ctx.fill();
                setTimeout(() => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 800);
            }
        }
        canvas.addEventListener('click', (e) => drawFirework(e.clientX, e.clientY));
    </script>
</body>
</html>
