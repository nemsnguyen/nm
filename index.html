<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hoan Tất Niên</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://alpha.creativecirclecdn.com/environment/original/20240812-124851-c69-sky-full-of-fireworks.jpg'); /* Hình nền Tết rực rỡ */
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: white;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2); /* Làm nền tối hơn để dễ đọc chữ */
        }
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px;
        }
        .content h1 {
            font-size: 3rem;
            color: #FF0000; /* Màu đỏ chủ đạo */
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Hiệu ứng bóng cho chữ */
        }
        .content p {
            font-size: 1.5rem;
            line-height: 1.6;
            margin: 10px 0;
        }
        .separator img {
            max-width: 80%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        iframe {
            width: 80%;
            max-width: 800px;
            height: 600px;
            border: none;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .fireworks-img {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
